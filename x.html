<!doctype html>
<html lang="fr">
<head><script>if(location.protocol==="http:"&&location.hostname!=="localhost")location.replace("https:"+location.href.slice(5));</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Publier sur X</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
         background: #0b1426; color: #e8edf5; padding: 16px; box-sizing: border-box; }
  main { max-width: 420px; width: 100%; text-align: center; }
  h1 { font-size: 20px; margin: 0 0 18px; font-weight: 600; }
  a { display: block; padding: 14px; border-radius: 14px; text-decoration: none; font-weight: 600; margin-top: 10px; }
  .app { background: #fff; color: #000; }
  .web { background: transparent; color: #9fb2cf; border: 1px solid #2a3a57; }
</style>
</head>
<body>
<main>
  <h1>Ouverture de X…</h1>
  <a class="app" id="app" href="#">Ouvrir dans l'app X</a>
  <a class="web" id="web" href="#">Ouvrir sur x.com</a>
</main>
<script>
  // Le texte du tweet est dans l'adresse après « # » : il n'est jamais envoyé à un serveur.
  var texte = decodeURIComponent(location.hash.slice(1));
  var enc = encodeURIComponent(texte);
  var app = "twitter://post?message=" + enc;
  document.getElementById("app").href = app;
  document.getElementById("web").href = "https://x.com/intent/post?text=" + enc;
  if (texte) location.href = app;
</script>
</body>
</html>
